gamma = 0.75
gae_lambda = 0.99
ent_coef = 0.01
vf_coef = 1.0
clip_coef = 0.15
max_grad_norm = 1.0
minibatch_size = 8192
bptt_horizon = 256
update_epochs = 1
anneal_lr = True
checkpoint_interval = 25

[sweep]
method = Protein
metric = mean_uncertainty
goal = minimize
metric_distribution = linear

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.4
max = 0.995
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00003
max = 0.003
scale = auto

