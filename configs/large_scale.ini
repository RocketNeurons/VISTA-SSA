; Large-scale Phase II scenario: 48 sensors across three orbital planes tasked
; with a 20,000-object catalogue over a 2.5 h episode (1800 steps x 5 s).
; This is the scenario shown in the README animation. The released Phase II
; VISTA checkpoint runs it zero-shot:
;   vista eval configs/large_scale.ini --checkpoint checkpoints/phase2_vista.pt --render --output runs/large_scale
[base]
package = vista
env_name = phase2_large_scale
policy_name = OrbitalEyesGraphAttention
rnn_name = OrbitalEyesGraphAttentionLSTM

[policy]
num_agents = 48
rso_top_k = 60
action_mode = 0
d_model = 64
nhead = 4
transformer_num_layers = 1
hidden_size = 64

[rnn]
input_size = 64
hidden_size = 64

[vec]
num_envs = 4

[env]
; 20k RSOs per env is heavy; keep few parallel envs when training
num_envs = 12
num_agents = 48
num_rso = 20000
max_steps = 1800
dt = 5.0
action_mode = 0
rso_top_k = 60
propagation_mode = 0
fov_deg = 4.0
max_slew_rate_deg = 5.0
num_orbits = 3
orbit_0_a = 7078.0
orbit_0_e = 0.001
orbit_0_inc = 98.0
orbit_0_raan = 0.0
orbit_0_omega = 0.0
orbit_0_num_sats = 16
orbit_1_a = 7078.0
orbit_1_e = 0.001
orbit_1_inc = 90.0
orbit_1_raan = 90.0
orbit_1_omega = 0.0
orbit_1_num_sats = 16
orbit_2_a = 6778.0
orbit_2_e = 0.001
orbit_2_inc = 51.6
orbit_2_raan = 45.0
orbit_2_omega = 0.0
orbit_2_num_sats = 16
rso_a_min = 6800.0
rso_a_max = 7200.0
rso_e_min = 0.0
rso_e_max = 0.02
rso_inc_min = 0.0
rso_inc_max = 100.0
rso_size_min = 0.1
rso_size_max = 5.0
growth_mode = 0
growth_a_r = 2e-5
growth_a_t = 8e-5
growth_a_n = 2e-5
growth_b_r = 2e-8
growth_b_t = 1e-7
growth_b_n = 2e-8
k_v = 1e-6
reduction_mode = 0
alpha_r = 0.05
alpha_t = 0.03
alpha_n = 0.05
alpha_vel = 2e-4
u_min_r = 0.02
u_min_t = 0.02
u_min_n = 0.02
vel_u_min = 2e-5
uncertainty_mode = 2
ekf_sigma_a = 1e-7
ekf_meas_sigma = 0.05
ekf_max_substep_dt = 60.0
ekf_sigma_max = 50.0
u_init_r = 1.0
u_init_t = 2.0
u_init_n = 1.0
u_init_r_max = 5.0
u_init_t_max = 20.0
u_init_n_max = 5.0
sigma_vel_init = 0.001
sigma_vel_init_max = 0.005
age_init = 100.0
age_init_max = 10000.0
quality_mode = 0
quality_dist_weight = 0.4
quality_angle_weight = 0.4
quality_size_weight = 0.2
max_obs_range = 3000.0
enable_earth_mask = 1
enable_range_mask = 0
enable_fov_obs = 0
reward_mode = 1
alpha_u = 750.0
alpha_v = 750.0
alpha_local = 0.0
alpha_ctrl = 0.0
reward_scale = 0
reward_baseline = 0
reward_clip_min = -1.0
uncertainty_threshold = 3.0
team_spirit = 1.0
priority_alpha = 1.0
priority_beta = 0.5
priority_gamma = 0.1
obs_dist_norm = 10000.0
obs_vel_norm = 10.0
obs_age_norm = 1000.0
obs_u_norm = 1.0
obs_u_vel_norm = 0.001
render_scale = 0.01
render_rso_scale = 0.5
render_fps = 20

[train]
batch_size = auto
minibatch_size = 8192
bptt_horizon = 32
update_epochs = 1
gamma = 0.65
gae_lambda = 0.99
clip_coef = 0.2
ent_coef = 0.0003
anneal_lr = False
learning_rate = 0.0007019435483003571
total_timesteps = 250000000

[sweep]
method = Protein
metric = mean_uncertainty
goal = minimize
metric_distribution = linear

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.4
max = 0.995
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00003
max = 0.003
scale = auto
