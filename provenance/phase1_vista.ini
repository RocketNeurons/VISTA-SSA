[base]
package = ocean
env_name = puffer_orbital_eyes_fixed_single_sensor_calibrated_v1_attention
policy_name = VISTA
rnn_name = VISTALSTM
checkpoint_interval = 25

[policy]
num_agents = 1
rso_top_k = 30
action_mode = 0

; Frozen paper architecture selected on disjoint screening seeds.
d_model = 32
nhead = 4
transformer_num_layers = 1
hidden_size = 64
mask_actions = True

[rnn]
input_size = 64
hidden_size = 64
; Both recurrent dimensions must match policy.hidden_size.

[vec]
num_envs = 12


[env]
num_envs = 128
num_agents = 1
num_rso = 30
max_steps = 4000
report_interval = 4000
dt = 5.0
action_mode = 0
rso_top_k = 30
propagation_mode = 0
fixed_rso_slots = 1
ground_sensor = 1
ground_lat_deg = 0.0
ground_lon_deg = 0.0
ground_alt_km = 0.0

fov_deg = 6.0
max_slew_rate_deg = 0.5

num_orbits = 1
orbit_0_a = 7078.0
orbit_0_e = 0.001
orbit_0_inc = 98.0
orbit_0_raan = 0.0
orbit_0_omega = 0.0
orbit_0_num_sats = 1

rso_a_min = 7000.0
rso_a_max = 7150.0
rso_e_min = 0.0
rso_e_max = 0.005
rso_inc_min = 35.0
rso_inc_max = 85.0
rso_raan_min = 0.0
rso_raan_max = 0.0
rso_omega_min = 0.0
rso_omega_max = 360.0
rso_size_min = 0.1
rso_size_max = 5.0

growth_mode = 0
growth_a_r = 2e-5
growth_a_t = 8e-5
growth_a_n = 2e-5
growth_b_r = 2e-8
growth_b_t = 1e-7
growth_b_n = 2e-8
k_v = 1e-6
reduction_mode = 0
alpha_r = 0.025
alpha_t = 0.015
alpha_n = 0.025
alpha_vel = 1e-4
u_min_r = 0.02
u_min_t = 0.02
u_min_n = 0.02
vel_u_min = 2e-5

uncertainty_mode = 2
ekf_sigma_a = 1e-7
ekf_meas_sigma = 0.05
ekf_max_substep_dt = 60.0
ekf_sigma_max = 50.0

u_init_r = 1.0
u_init_t = 3.0
u_init_n = 1.0
u_init_r_max = 2.0
u_init_t_max = 6.0
u_init_n_max = 2.0
sigma_vel_init = 0.001
sigma_vel_init_max = 0.002
age_init = 500.0
age_init_max = 3000.0

quality_mode = 1
quality_dist_weight = 0.65
quality_angle_weight = 0.25
quality_size_weight = 0.10
max_obs_range = 3000.0

enable_earth_mask = 1
enable_range_mask = 1
enable_fov_obs = 0

reward_mode = 5
alpha_u = 750.0
alpha_v = 750.0
alpha_local = 0.0
alpha_ctrl = 0.0
reward_scale = 0
reward_baseline = 0
reward_u_ref = 0.0
reward_u_target = 1.0
reward_mean_target = 0.80
reward_tail_target = 2.50
reward_max_target = 3.50
reward_fine_max_start = 4.50
reward_fine_max_target = 3.80
reward_fine_max_temperature = 0.25
reward_fine_max_weight = 0.05
reward_fine_bonus_scale = 0.80
reward_fine_mean_start = 1.0
reward_fine_mean_bonus_scale = 0.60
reward_clip_min = -1.0
reward_clip_max = 1.0
reward_mean_weight = 0.55
reward_tail_weight = 0.30
reward_max_weight = 0.15
reward_threshold_weight = 0.0
reward_tail_frac = 0.10
reward_delta_scale = 4.0
reward_level_scale = 0.05
reward_terminal_bonus = 0.0
uncertainty_threshold = 5.0
team_spirit = 1.0

priority_alpha = 1.0
priority_beta = 0.5
priority_gamma = 0.1

obs_dist_norm = 10000.0
obs_vel_norm = 10.0
obs_age_norm = 3000.0
obs_u_norm = 10.0
obs_u_vel_norm = 0.001

render_scale = 0.01
render_rso_scale = 0.5
render_fps = 60


[train]
total_timesteps = 500000000
batch_size = auto
minibatch_size = 16384
bptt_horizon = 128
update_epochs = 1
gamma = 0.5101153009144777
gae_lambda = 0.99
ent_coef = 0.0003235869617933112
anneal_lr = True
learning_rate = 0.001368322223917122
checkpoint_interval = 25




[sweep]
method = Protein
metric = max_uncertainty
metric_distribution = linear
goal = minimize
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

; PPO sweep for the fixed-size attention baseline. The architecture is held
; fixed here so the initial comparison uses the same PPO search space as LSTM.

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.4
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.95
max = 0.9995
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0003
max = 0.005
scale = auto

[sweep.train.clip_coef]
distribution = log_normal
min = 0.10
max = 0.25
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
max = 1.5
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 1.5
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 32768
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 15e7
max = 25e7
scale = time


